<app-assignment-inbox
    [previewInPlace]="true"
    (previewRequested)="openAssignmentDetail($event)"
    (changed)="reloadAssignments()" />
<div class="calendario-wrapper">
  @if (loading()) {
    <p class="loading-msg">Cargando tus trabajos...</p>
  }
    @if (error()) {
        <p role="alert" style="color: #b91c1c;">{{ error() }}</p>
    }

  <div #calendar id="calendar"></div>
</div>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  height="100%"
  aria-hidden="true"
  focusable="false"
>
  @for (triangle of backgroundTriangles(); track triangle.id) {
    <polygon
      class="bg-triangle"
      [attr.points]="triangle.points"
      [attr.fill]="triangle.color"
      [attr.fill-opacity]="triangle.minimumOpacity"
      [attr.stroke]="triangle.color"
      stroke-opacity="0.18"
      stroke-width="0.5"
      [style.--min-opacity]="triangle.minimumOpacity"
      [style.--max-opacity]="triangle.maximumOpacity"
      [style.animation-duration]="triangle.duration"
      [style.animation-delay]="triangle.delay"
    ></polygon>
  }
</svg>

<div class="login-wrapper">
  <div class="login-card">
    <section class="form-panel" aria-labelledby="login-title">
      <div class="logo">
        <img
          src="img/logohexa.png"
          alt="Logo de RemoMN"
          class="login-logo"
        />
        <span class="logo-text">RemoMN</span>
      </div>

      <h1 id="login-title">Iniciar sesión</h1>
      <p class="subtitle">Bienvenido de vuelta</p>

      <form
        id="loginForm"
        [formGroup]="loginForm"
        (ngSubmit)="submitLogin()"
        [attr.aria-busy]="isSubmitting()"
        novalidate
      >
        <div class="field">
          <label for="email">Correo Electrónico</label>

          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
            [readOnly]="isSubmitting() || isRecoveringPassword()"
            [attr.aria-invalid]="
              loginForm.controls.email.touched &&
              loginForm.controls.email.invalid
            "
          />
        </div>

        <div class="field password-field">
          <label for="password">Contraseña</label>

          <div class="password-wrapper">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••••"
              autocomplete="current-password"
              required
              [readOnly]="isSubmitting() || isRecoveringPassword()"
              [attr.aria-invalid]="
                loginForm.controls.password.touched &&
                loginForm.controls.password.invalid
              "
            />

            <button
              id="togglePassword"
              class="toggle-password"
              type="button"
              aria-controls="password"
              [attr.aria-label]="
                showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'
              "
              [attr.aria-pressed]="showPassword()"
              (click)="togglePassword()"
            >
              {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>

          <button
            id="forgotPasswordBtn"
            class="forgot"
            type="button"
            [disabled]="isSubmitting() || isRecoveringPassword()"
            (click)="recoverPassword()"
          >
            ¿Olvidaste tu contraseña?
          </button>
        </div>

        <button
          id="submitBtn"
          class="submit-button"
          type="submit"
          [disabled]="isSubmitting() || isRecoveringPassword()"
        >
          @if (isSubmitting()) {
            Verificando...
          } @else {
            Entrar
          }
        </button>
      </form>
    </section>

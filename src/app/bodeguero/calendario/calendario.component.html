<div class="calendario-wrapper">
    <div class="filter-bar">
        <label for="filterEmployee">Filtrar por subcontratista:</label>
        <select id="filterEmployee" [disabled]="loading()" [(ngModel)]="filterEmployeeId" (ngModelChange)="onFilterChange()">
            <option value="">Todos los Subcontratistas</option>
            @for (emp of employees(); track emp.id) {
            <option [value]="emp.id">{{ emp.name }}</option>
            }
        </select>
        <button type="button" class="btn-reset" (click)="resetFilter()" [disabled]="loading()">
            Limpiar filtro
        </button>
    </div>

    <!-- Leyenda de estados (iconos animados) -->
    <div class="calendar-legend">
        <div class="legend-item">
            <i class="fa-solid fa-clock" style="color:#ff9800;"></i> Pendiente
        </div>
        <div class="legend-item">
            <i class="fa-solid fa-gear fa-spin" style="color:#12CFF4;"></i> En progreso
        </div>
        <div class="legend-item">
            <i class="fa-solid fa-check-double" style="color:#6c757d;"></i> Completado
        </div>
        <div class="legend-item">
            <i class="fa-solid fa-ban" style="color:#d32f2f;"></i> Cancelado
        </div>
        <div class="legend-item" style="margin-left:auto; font-weight:500; color:#64748B;">
            El color del evento = color del subcontratista
        </div>
    </div>

    @if (loading()) {
    <p class="loading-msg">Cargando cronograma...</p>
    }

    @if (error()) {
    <div class="loading-msg" role="alert">
        <p>{{ error() }}</p>
        <button type="button" class="btn-reset" (click)="loadData()" [disabled]="loading()">Reintentar</button>
    </div>
    }
    <div #calendar id="calendar"></div>
</div>
